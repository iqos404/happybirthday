<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Моя открытка</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="login" class="window">

<h2>🔐 Вход</h2>

<input type="text" id="username" placeholder="Логин">

<input type="password" id="password" placeholder="Пароль">

<button onclick="login()">Войти</button>

<p id="error"></p>

</div>

<div id="card" class="window">

<h1>🎉 Поздравляем! 🎉</h1>

<img src="photo.jpg">

<p>

Бабушка, поздравляем тебя с днем рождения!<br>

Пусть сегодня и всегда тебя окружают родные люди, забота и любовь близких.<br>

Желаем тебе - долгих и радостных лет жизни, здоровья, сил, хорошего сна,<br>

бодрого дня и много-много счастья!

</p>

<button onclick="logout()">Выйти</button>

</div>

<audio id="music" loop>

<source src="music.mp3" type="audio/mpeg">

</audio>

<script src="script.js"></script>

</body>

</html>
